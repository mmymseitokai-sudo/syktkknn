<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欠席連絡アプリ</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .app-container { background: white; width: 100%; max-width: 420px; border: 2px solid #333; border-radius: 20px; padding: 15px; box-shadow: 5px 5px 0px #333; box-sizing: border-box; }
        .calendar-header { border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 15px; text-align: center; font-size: 22px; font-weight: bold; }
        .info-text { font-size: 14px; margin-bottom: 8px; font-weight: bold; }
        
        /* 画面切り替え */
        .screen { display: none; }
        .user-badge { background: #f1f2f6; padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #ddd; }
        .change-name-link { font-size: 12px; color: #1e90ff; text-decoration: underline; cursor: pointer; }

        /* カレンダー全体のスタイル */
        .calendar-box { border: 2px solid #333; border-radius: 12px; padding: 10px; margin-bottom: 15px; background: #fff; }
        .cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: bold; font-size: 18px; }
        .cal-nav button { background: none; border: 1px solid #333; border-radius: 5px; padding: 4px 10px; cursor: pointer; font-weight: bold; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 4px; }
        .cal-head { font-size: 13px; font-weight: bold; padding-bottom: 4px; border-bottom: 1px solid #333; }
        .cal-head.sun { color: #ff4757; }
        .cal-head.sat { color: #1e90ff; }
        
        /* 日付マス */
        .cal-day { min-height: 38px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 14px; border-radius: 6px; cursor: default; position: relative; }
        .cal-day.other-month { color: #ccc; }
        .cal-day.selectable { cursor: pointer; }
        .cal-day.selectable:hover { background-color: #f1f2f6; }
        .cal-day.selected { background-color: #ffeaa7 !important; border: 2px solid #333 !important; }

        /* 手書き風の赤丸・青丸スタイル */
        .circle-mark { width: 28px; height: 28px; line-height: 26px; border-radius: 50%; font-weight: bold; box-sizing: border-box; text-align: center; }
        .circle-meeting { border: 2px solid #ff4757; color: #ff4757; }
        .circle-prep { border: 2px solid #1e90ff; color: #1e90ff; }

        /* 凡例 */
        .cal-legend { display: flex; justify-content: center; gap: 15px; font-size: 12px; margin-top: 10px; padding-top: 8px; border-top: 1px dashed #ccc; font-weight: bold; }
        .legend-item { display: flex; align-items: center; gap: 4px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .dot.meeting { border: 2px solid #ff4757; }
        .dot.prep { border: 2px solid #1e90ff; }

        /* 選択中のイベント表示カード */
        .selected-event-card { background: #fdfbf7; border: 2px dashed #333; border-radius: 8px; padding: 10px; margin-bottom: 15px; text-align: center; }
        .selected-event-title { font-size: 16px; font-weight: bold; margin-top: 4px; }

        /* フォームパーツ */
        .btn-status { width: 48%; padding: 12px; border: 2px solid #333; border-radius: 10px; background: white; font-weight: bold; cursor: pointer; display: inline-block; text-align: center; box-sizing: border-box; margin-bottom: 12px; }
        .btn-status.active { background: #333; color: white; }
        .chip { padding: 8px 12px; border: 1px solid #333; border-radius: 20px; font-size: 13px; background: white; cursor: pointer; margin-bottom: 8px; display: inline-block; }
        .chip.active { background: #333; color: white; }
        input { width: 100%; padding: 10px; border: 1px solid #333; border-radius: 5px; box-sizing: border-box; margin-bottom: 12px; font-size: 15px; }
        .submit-btn { width: 100%; padding: 14px; background: #ff4757; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 17px; margin-top: 5px; cursor: pointer; }
        .next-btn { width: 100%; padding: 14px; background: #2ed573; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 17px; cursor: pointer; }
        .login-btn { width: 100%; padding: 14px; background: #4285F4; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="calendar-header">欠席連絡フォーム</div>

    <!-- 画面1: ログイン画面 -->
    <div id="login-screen" class="screen" style="display: block; text-align: center;">
        <p style="margin-bottom: 25px; color: #555;">Googleアカウントで<br>ログインしてください。</p>
        <button class="login-btn" id="loginBtn">Googleでログイン</button>
    </div>

    <!-- 画面2: 名前登録画面（初回のみ） -->
    <div id="profile-screen" class="screen">
        <p style="font-size: 14px; color: #666; margin-bottom: 15px;">初回登録です。あなたのお名前を入力してください。</p>
        <div class="info-text">お名前（フルネーム）</div>
        <input type="text" id="regName" placeholder="例：山田 太郎">
        <button class="next-btn" id="saveProfileBtn">登録して次へ進む</button>
    </div>

    <!-- 画面3: 欠席連絡画面 -->
    <div id="app-content" class="screen">
        <div class="user-badge">
            <div><strong><span id="displayName"></span></strong> さん</div>
            <span class="change-name-link" id="editProfileBtn">名前変更</span>
        </div>

        <!-- 月間カレンダー -->
        <div class="calendar-box">
            <div class="cal-nav">
                <button id="prevMonthBtn">＜</button>
                <span id="calMonthDisplay">0月</span>
                <button id="nextMonthBtn">＞</button>
            </div>
            <div class="cal-grid">
                <div class="cal-head sun">日</div>
                <div class="cal-head">月</div>
                <div class="cal-head">火</div>
                <div class="cal-head">水</div>
                <div class="cal-head">木</div>
                <div class="cal-head">金</div>
                <div class="cal-head sat">土</div>
            </div>
            <div class="cal-grid" id="calDaysContainer" style="margin-top: 4px;">
                <!-- 日付がJSで生成されます -->
            </div>
            <!-- 凡例 -->
            <div class="cal-legend">
                <div class="legend-item"><span class="dot meeting"></span> ミーティング</div>
                <div class="legend-item"><span class="dot prep"></span> 文化祭準備</div>
            </div>
        </div>

        <!-- 選択した予定の表示エリア -->
        <div class="selected-event-card" id="selectedEventCard">
            <div style="font-size: 12px; color: #666;">カレンダーの丸がついた日をタップしてください</div>
            <div class="selected-event-title" id="selectedEventTitle">予定が未選択です</div>
        </div>

        <!-- フォーム部分（予定選択後に有効化） -->
        <div id="formSection" style="opacity: 0.4; pointer-events: none;">
            <div style="display: flex; justify-content: space-between;">
                <div class="btn-status active" id="btnAbsent">欠席</div>
                <div class="btn-status" id="btnLate">遅刻</div>
            </div>

            <div class="info-text">理由</div>
            <div id="reasonContainer"></div>
            <input type="text" id="otherReason" placeholder="具体的な理由を入力" style="display:none;">

            <div id="arrivalSection" style="display:none;">
                <div class="info-text">到着予定（遅刻の場合）</div>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="arriveMin" placeholder="分後" style="width: 60%;">
                    <div class="chip" id="btnUndecided" style="width: 35%; text-align: center; box-sizing: border-box;">未定</div>
                </div>
            </div>

            <button class="submit-btn" id="submitBtn">報告を送信する</button>
        </div>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, collection, doc, getDoc, setDoc, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDSFJupOUtPV1zNlPxcYaQOzZyVU34w7o0",
    authDomain: "kesseki-appointment.firebaseapp.com",
    projectId: "kesseki-appointment",
    storageBucket: "kesseki-appointment.firebasestorage.app",
    messagingSenderId: "1043634407845",
    appId: "1:1043634407845:web:4a0f7bd36079dd6858c04c",
    measurementId: "G-H6BWPXJTFQ"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let userData = null;
  let currentStatus = "欠席";
  let selectedReason = "";
  let allEvents = [];
  let selectedEvent = null;

  let viewDate = new Date(); // 現在表示している年月

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(el => el.style.display = 'none');
    document.getElementById(screenId).style.display = 'block';
  }

  document.getElementById('loginBtn').onclick = () => {
    signInWithPopup(auth, new GoogleAuthProvider()).catch(e => alert("ログインエラー: " + e.message));
  };

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      checkUserProfile();
    } else {
      showScreen('login-screen');
    }
  });

  async function checkUserProfile() {
    try {
      const userDocRef = doc(db, "users", currentUser.uid);
      const docSnap = await getDoc(userDocRef);
      if (docSnap.exists()) {
        userData = docSnap.data();
        showAppContent();
      } else {
        showScreen('profile-screen');
      }
    } catch (e) {
      alert("ユーザー情報の確認に失敗しました: " + e.message);
    }
  }

  document.getElementById('saveProfileBtn').onclick = async () => {
    const name = document.getElementById('regName').value.trim();
    if (!name) return alert("お名前を入力してください");
    try {
      const userDocRef = doc(db, "users", currentUser.uid);
      userData = { name: name, email: currentUser.email, updatedAt: serverTimestamp() };
      await setDoc(userDocRef, userData);
      showAppContent();
    } catch (e) { alert("登録エラー: " + e.message); }
  };

  document.getElementById('editProfileBtn').onclick = () => {
    document.getElementById('regName').value = userData.name || "";
    showScreen('profile-screen');
  };

  function showAppContent() {
    document.getElementById('displayName').innerText = userData.name || "";
    showScreen('app-content');
    loadEvents();
  }

  // 予定一覧を読み込み
  function loadEvents() {
    const q = query(collection(db, "events"), orderBy("date", "asc"));
    onSnapshot(q, (snapshot) => {
      allEvents = [];
      snapshot.forEach(docSnap => {
        allEvents.push({ id: docSnap.id, ...docSnap.data() });
      });
      renderCalendar();
    });
  }

  // カレンダー描画ロジック
  function renderCalendar() {
    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    
    document.getElementById('calMonthDisplay').innerText = `${year}年 ${month + 1}月`;

    const firstDay = new Date(year, month, 1).getDay(); // 1日の曜日
    const lastDate = new Date(year, month + 1, 0).getDate(); // 当月末日
    const prevLastDate = new Date(year, month, 0).getDate(); // 前月末日

    const container = document.getElementById('calDaysContainer');
    container.innerHTML = "";

    // 前月の日付埋め
    for (let i = firstDay - 1; i >= 0; i--) {
      const div = document.createElement('div');
      div.className = "cal-day other-month";
      div.innerText = prevLastDate - i;
      container.appendChild(div);
    }

    // 当月の日付
    for (let d = 1; d <= lastDate; d++) {
      const div = document.createElement('div');
      div.className = "cal-day";
      
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      // この日にある予定を検索
      const dayEvents = allEvents.filter(e => e.date && e.date.startsWith(dateStr));

      if (dayEvents.length > 0) {
        const ev = dayEvents[0]; // 該当イベント
        div.classList.add('selectable');

        const circle = document.createElement('div');
        circle.className = `circle-mark ${ev.category === 'ミーティング' ? 'circle-meeting' : 'circle-prep'}`;
        circle.innerText = d;
        div.appendChild(circle);

        if (selectedEvent && selectedEvent.id === ev.id) {
          div.classList.add('selected');
        }

        div.onclick = () => selectEvent(ev, div);
      } else {
        div.innerText = d;
      }

      container.appendChild(div);
    }

    // 翌月の余白埋め
    const totalCells = firstDay + lastDate;
    const nextDays = (totalCells % 7 === 0) ? 0 : 7 - (totalCells % 7);
    for (let i = 1; i <= nextDays; i++) {
      const div = document.createElement('div');
      div.className = "cal-day other-month";
      div.innerText = i;
      container.appendChild(div);
    }
  }

  // 月切り替えボタン
  document.getElementById('prevMonthBtn').onclick = () => {
    viewDate.setMonth(viewDate.getMonth() - 1);
    renderCalendar();
  };
  document.getElementById('nextMonthBtn').onclick = () => {
    viewDate.setMonth(viewDate.getMonth() + 1);
    renderCalendar();
  };

  // カレンダーの日付がタップされた時
  function selectEvent(ev, dayElement) {
    selectedEvent = ev;
    
    // ハイライト更新
    document.querySelectorAll('.cal-day').forEach(el => el.classList.remove('selected'));
    dayElement.classList.add('selected');

    // 選択中の予定表示を更新
    const dateFormatted = ev.date.replace('T', ' ');
    document.getElementById('selectedEventCard').innerHTML = `
      <div style="font-size: 12px; color: ${ev.category === 'ミーティング' ? '#ff4757' : '#1e90ff'}; font-weight:bold;">● ${ev.category}</div>
      <div class="selected-event-title">${dateFormatted}<br>${ev.title}</div>
    `;

    // フォームを有効化
    const formSection = document.getElementById('formSection');
    formSection.style.opacity = "1";
    formSection.style.pointerEvents = "auto";

    updateStatusUI();
  }

  // 理由ボタンの表示
  function updateReasons() {
    if (!selectedEvent) return;
    const category = selectedEvent.category || "ミーティング";

    let reasons = (category === "ミーティング")
        ? (currentStatus === "欠席" ? ["体調不良", "部活動", "委員会", "その他"] : ["部活動", "委員会", "その他"])
        : (currentStatus === "欠席" ? ["体調不良", "部活動", "家庭の用事", "その他"] : ["部活動", "家庭の用事", "その他"]);

    const container = document.getElementById('reasonContainer');
    container.innerHTML = "";
    selectedReason = "";
    document.getElementById('otherReason').style.display = "none";

    reasons.forEach(r => {
      const div = document.createElement('div');
      div.className = 'chip';
      div.innerText = r;
      div.onclick = () => {
        document.querySelectorAll('#reasonContainer .chip').forEach(c => c.classList.remove('active'));
        div.classList.add('active');
        selectedReason = r;
        document.getElementById('otherReason').style.display = (r === "その他") ? "block" : "none";
      };
      container.appendChild(div);
    });
  }

  document.getElementById('btnAbsent').onclick = () => { currentStatus = "欠席"; updateStatusUI(); };
  document.getElementById('btnLate').onclick = () => { currentStatus = "遅刻"; updateStatusUI(); };

  function updateStatusUI() {
    document.getElementById('btnAbsent').className = currentStatus === "欠席" ? "btn-status active" : "btn-status";
    document.getElementById('btnLate').className = currentStatus === "遅刻" ? "btn-status active" : "btn-status";
    document.getElementById('arrivalSection').style.display = currentStatus === "遅刻" ? "block" : "none";
    updateReasons();
  }

  document.getElementById('btnUndecided').onclick = (e) => {
    e.target.classList.toggle('active');
    const inputMin = document.getElementById('arriveMin');
    if (e.target.classList.contains('active')) {
      inputMin.value = "";
      inputMin.disabled = true;
    } else {
      inputMin.disabled = false;
    }
  };

  // 送信処理
  document.getElementById('submitBtn').onclick = async () => {
    if (!selectedEvent) return alert("カレンダーから予定を選択してください");
    if (!selectedReason) return alert("理由を選択してください");
    
    const otherText = document.getElementById('otherReason').value;
    if (selectedReason === "その他" && !otherText) return alert("その他の具体的な理由を入力してください");

    let arrivalInfo = "";
    if (currentStatus === "遅刻") {
      const isUndecided = document.getElementById('btnUndecided').classList.contains('active');
      const min = document.getElementById('arriveMin').value;
      if (!isUndecided && !min) return alert("到着予定時刻（分後）を入力するか、未定を選択してください");
      arrivalInfo = isUndecided ? "未定" : `${min}分後`;
    }

    try {
      await addDoc(collection(db, "reports"), {
        name: userData.name,
        email: currentUser.email,
        eventTitle: selectedEvent.title,
        eventDate: selectedEvent.date,
        year: selectedEvent.year || "令和6年度",
        status: currentStatus,
        reason: selectedReason,
        otherReason: otherText,
        arrival: arrivalInfo,
        timestamp: serverTimestamp()
      });
      alert("送信が完了しました！");
      location.reload();
    } catch (e) {
      alert("送信エラー: " + e.message);
    }
  };
</script>
</body>
</html>
