<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欠席連絡システム</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #ffffff; margin: 0; padding: 15px; display: flex; justify-content: center; color: #111111; }
        .app-container { background: #ffffff; width: 100%; max-width: 420px; border: 1px solid #111111; border-radius: 8px; padding: 20px; box-sizing: border-box; }
        .header-title { border-bottom: 2px solid #111111; padding-bottom: 10px; margin-bottom: 15px; text-align: center; font-size: 18px; font-weight: bold; }
        .info-text { font-size: 13px; margin-bottom: 6px; font-weight: bold; color: #111111; }
        
        .screen { display: none; }
        .user-badge { border: 1px solid #111111; padding: 8px 12px; border-radius: 4px; margin-bottom: 15px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .change-name-link { font-size: 12px; color: #111111; text-decoration: underline; cursor: pointer; }

        /* カレンダー（背景色なし・枠線のみ） */
        .calendar-box { border: 1px solid #111111; border-radius: 6px; padding: 10px; margin-bottom: 15px; background: #ffffff; }
        .cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: bold; font-size: 15px; }
        .cal-nav button { background: #ffffff; border: 1px solid #111111; border-radius: 4px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 2px; }
        .cal-head { font-size: 12px; font-weight: bold; padding-bottom: 4px; border-bottom: 1px solid #111111; color: #111111; }
        
        .cal-day { min-height: 36px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; cursor: default; }
        .cal-day.other-month { color: #cccccc; }
        .cal-day.selectable { cursor: pointer; }
        .cal-day.selectable:hover { text-decoration: underline; }
        .cal-day.selected { background-color: #111111 !important; color: #ffffff !important; font-weight: bold; border-radius: 4px; }

        /* 予定がある日の目印（枠線のみ、背景色なし） */
        .circle-mark { width: 28px; height: 28px; line-height: 26px; border: 1px solid #111111; border-radius: 50%; font-weight: bold; box-sizing: border-box; text-align: center; color: #111111; }
        .cal-day.selected .circle-mark { border-color: #ffffff; color: #ffffff; }

        .selected-event-card { border: 1px solid #111111; border-radius: 4px; padding: 10px; margin-bottom: 15px; text-align: center; }
        .selected-event-title { font-size: 14px; font-weight: bold; margin-top: 4px; }

        .already-sent-box { border: 1px solid #111111; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 13px; text-align: center; }
        .cancel-btn { background: #ffffff; color: #111111; border: 1px solid #111111; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; margin-top: 8px; font-weight: bold; }
        .cancel-btn:hover { background: #111111; color: #ffffff; }

        /* フォームパーツ */
        .status-group { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 12px; }
        .btn-status { flex: 1; padding: 10px; border: 1px solid #111111; border-radius: 4px; background: white; font-weight: bold; cursor: pointer; text-align: center; font-size: 13px; }
        .btn-status.active { background: #111111; color: white; }

        .chip { padding: 6px 12px; border: 1px solid #111111; border-radius: 4px; font-size: 12px; background: white; cursor: pointer; margin-bottom: 6px; display: inline-block; }
        .chip.active { background: #111111; color: white; }
        input { width: 100%; padding: 8px; border: 1px solid #111111; border-radius: 4px; box-sizing: border-box; margin-bottom: 12px; font-size: 13px; }
        .submit-btn { width: 100%; padding: 12px; background: #111111; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header-title">欠席連絡フォーム</div>

    <div id="login-screen" class="screen" style="display: block; text-align: center;">
        <p style="margin-bottom: 20px; font-size: 13px;">Googleアカウントでログインしてください。</p>
        <button class="submit-btn" id="loginBtn">ログイン</button>
    </div>

    <div id="profile-screen" class="screen">
        <p style="font-size: 13px; margin-bottom: 15px;">初回登録です。氏名を入力してください。</p>
        <div class="info-text">氏名（フルネーム）</div>
        <input type="text" id="regName" placeholder="例：山田 太郎">
        <button class="submit-btn" id="saveProfileBtn">登録して進む</button>
    </div>

    <div id="app-content" class="screen">
        <div class="user-badge">
            <div><strong><span id="displayName"></span></strong> さん</div>
            <span class="change-name-link" id="editProfileBtn">氏名変更</span>
        </div>

        <div class="calendar-box">
            <div class="cal-nav">
                <button id="prevMonthBtn">前月</button>
                <span id="calMonthDisplay">0月</span>
                <button id="nextMonthBtn">翌月</button>
            </div>
            <div class="cal-grid">
                <div class="cal-head">日</div><div class="cal-head">月</div><div class="cal-head">火</div><div class="cal-head">水</div><div class="cal-head">木</div><div class="cal-head">金</div><div class="cal-head">土</div>
            </div>
            <div class="cal-grid" id="calDaysContainer" style="margin-top: 4px;"></div>
        </div>

        <div class="selected-event-card" id="selectedEventCard">
            <div style="font-size: 12px; color: #555;">カレンダーの日付を選択してください</div>
            <div class="selected-event-title" id="selectedEventTitle">予定が未選択です</div>
        </div>

        <div id="alreadySentBox" class="already-sent-box" style="display:none;">
            <div>連絡済み：<strong id="sentStatusText"></strong></div>
            <button class="cancel-btn" id="cancelReportBtn">送信した連絡を取り消す</button>
        </div>

        <div id="formSection" style="opacity: 0.3; pointer-events: none;">
            <div class="status-group">
                <div class="btn-status active" id="btnAbsent">欠席</div>
                <div class="btn-status" id="btnLate">遅刻</div>
                <div class="btn-status" id="btnLeave">早退</div>
            </div>

            <div class="info-text">理由</div>
            <div id="reasonContainer"></div>
            <input type="text" id="otherReason" placeholder="具体的な理由を入力" style="display:none;">

            <div id="arrivalSection" style="display:none;">
                <div class="info-text">到着予定（遅刻の場合）</div>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="arriveMin" placeholder="分後" style="width: 60%;">
                    <div class="chip" id="btnUndecided" style="width: 35%; text-align: center; box-sizing: border-box;">未定</div>
                </div>
            </div>

            <div id="leaveSection" style="display:none;">
                <div class="info-text">早退予定時刻</div>
                <input type="time" id="leaveTime" style="width: 100%;">
            </div>

            <button class="submit-btn" id="submitBtn">報告を送信する</button>
        </div>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, collection, doc, getDoc, setDoc, addDoc, deleteDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDSFJupOUtPV1zNlPxcYaQOzZyVU34w7o0",
    authDomain: "kesseki-appointment.firebaseapp.com",
    projectId: "kesseki-appointment",
    storageBucket: "kesseki-appointment.firebasestorage.app",
    messagingSenderId: "1043634407845",
    appId: "1:1043634407845:web:4a0f7bd36079dd6858c04c",
    measurementId: "G-H6BWPXJTFQ"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let userData = null;
  let currentStatus = "欠席";
  let selectedReason = "";
  let allEvents = [];
  let allReports = [];
  let selectedEvent = null;
  let existingReport = null;
  let viewDate = new Date();

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(el => el.style.display = 'none');
    document.getElementById(screenId).style.display = 'block';
  }

  document.getElementById('loginBtn').onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => alert("ログインエラー: " + e.message));

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      checkUserProfile();
    } else {
      showScreen('login-screen');
    }
  });

  async function checkUserProfile() {
    try {
      const userDocRef = doc(db, "users", currentUser.uid);
      const docSnap = await getDoc(userDocRef);
      if (docSnap.exists()) {
        userData = docSnap.data();
        showAppContent();
      } else {
        showScreen('profile-screen');
      }
    } catch (e) {
      alert("エラー: " + e.message);
    }
  }

  document.getElementById('saveProfileBtn').onclick = async () => {
    const name = document.getElementById('regName').value.trim();
    if (!name) return alert("氏名を入力してください");
    try {
      const userDocRef = doc(db, "users", currentUser.uid);
      userData = { name: name, email: currentUser.email, updatedAt: serverTimestamp() };
      await setDoc(userDocRef, userData);
      showAppContent();
    } catch (e) { alert("登録エラー: " + e.message); }
  };

  document.getElementById('editProfileBtn').onclick = () => {
    document.getElementById('regName').value = userData.name || "";
    showScreen('profile-screen');
  };

  function showAppContent() {
    document.getElementById('displayName').innerText = userData.name || "";
    showScreen('app-content');
    loadEvents();
    loadReports();
  }

  function loadEvents() {
    const q = query(collection(db, "events"), orderBy("date", "asc"));
    onSnapshot(q, (snapshot) => {
      allEvents = [];
      snapshot.forEach(docSnap => {
        allEvents.push({ id: docSnap.id, ...docSnap.data() });
      });
      renderCalendar();
    });
  }

  function loadReports() {
    const q = query(collection(db, "reports"));
    onSnapshot(q, (snapshot) => {
      allReports = [];
      snapshot.forEach(docSnap => {
        allReports.push({ id: docSnap.id, ...docSnap.data() });
      });
      if (selectedEvent) checkExistingReport();
    });
  }

  function renderCalendar() {
    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    document.getElementById('calMonthDisplay').innerText = `${year}年 ${month + 1}月`;

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const prevLastDate = new Date(year, month, 0).getDate();

    const container = document.getElementById('calDaysContainer');
    container.innerHTML = "";

    for (let i = firstDay - 1; i >= 0; i--) {
      const div = document.createElement('div');
      div.className = "cal-day other-month";
      div.innerText = prevLastDate - i;
      container.appendChild(div);
    }

    for (let d = 1; d <= lastDate; d++) {
      const div = document.createElement('div');
      div.className = "cal-day";
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const dayEvents = allEvents.filter(e => e.date === dateStr);

      if (dayEvents.length > 0) {
        const ev = dayEvents[0];
        div.classList.add('selectable');

        const circle = document.createElement('div');
        circle.className = "circle-mark";
        circle.innerText = d;
        div.appendChild(circle);

        if (selectedEvent && selectedEvent.id === ev.id) {
          div.classList.add('selected');
        }

        div.onclick = () => selectEvent(ev, div);
      } else {
        div.innerText = d;
      }

      container.appendChild(div);
    }

    const totalCells = firstDay + lastDate;
    const nextDays = (totalCells % 7 === 0) ? 0 : 7 - (totalCells % 7);
    for (let i = 1; i <= nextDays; i++) {
      const div = document.createElement('div');
      div.className = "cal-day other-month";
      div.innerText = i;
      container.appendChild(div);
    }
  }

  document.getElementById('prevMonthBtn').onclick = () => { viewDate.setMonth(viewDate.getMonth() - 1); renderCalendar(); };
  document.getElementById('nextMonthBtn').onclick = () => { viewDate.setMonth(viewDate.getMonth() + 1); renderCalendar(); };

  function selectEvent(ev, dayElement) {
    selectedEvent = ev;
    document.querySelectorAll('.cal-day').forEach(el => el.classList.remove('selected'));
    dayElement.classList.add('selected');

    document.getElementById('selectedEventCard').innerHTML = `
      <div style="font-size: 12px; font-weight:bold; margin-bottom:4px;">${ev.category}</div>
      <div class="selected-event-title">${ev.date} (${ev.timeText || '時間指定なし'})<br>${ev.title}</div>
    `;

    checkExistingReport();
    updateStatusUI();
  }

  function checkExistingReport() {
    if (!selectedEvent || !currentUser) return;
    existingReport = allReports.find(r => r.eventDate === selectedEvent.date && r.email === currentUser.email);

    const alreadyBox = document.getElementById('alreadySentBox');
    const formSection = document.getElementById('formSection');

    if (existingReport) {
      alreadyBox.style.display = 'block';
      let detail = existingReport.status;
      if (existingReport.status === '遅刻') detail += ` (${existingReport.arrival || ''})`;
      if (existingReport.status === '早退') detail += ` (${existingReport.leaveTime || ''})`;
      detail += ` - 理由: ${existingReport.reason}`;
      document.getElementById('sentStatusText').innerText = detail;

      formSection.style.opacity = "0.3";
      formSection.style.pointerEvents = "none";
    } else {
      alreadyBox.style.display = 'none';
      formSection.style.opacity = "1";
      formSection.style.pointerEvents = "auto";
    }
  }

  document.getElementById('cancelReportBtn').onclick = async () => {
    if (!existingReport) return;
    if (!confirm("この連絡を取り消しますか？")) return;

    try {
      await deleteDoc(doc(db, "reports", existingReport.id));
      alert("連絡を取り消しました。");
    } catch (e) {
      alert("削除エラー: " + e.message);
    }
  };

  function updateReasons() {
    if (!selectedEvent) return;
    const category = selectedEvent.category || "ミーティング";

    let reasons = [];
    if (category === "ミーティング") {
        reasons = (currentStatus === "欠席" || currentStatus === "早退")
            ? ["体調不良", "部活動", "委員会", "その他"]
            : ["部活動", "委員会", "その他"];
    } else if (category === "文化祭準備") {
        reasons = (currentStatus === "欠席" || currentStatus === "早退")
            ? ["体調不良", "部活動", "家庭の用事", "その他"]
            : ["部活動", "家庭の用事", "その他"];
    } else {
        reasons = (currentStatus === "欠席" || currentStatus === "早退")
            ? ["体調不良", "部活動", "家庭の用事", "委員会", "その他"]
            : ["部活動", "家庭の用事", "委員会", "その他"];
    }

    const container = document.getElementById('reasonContainer');
    container.innerHTML = "";
    selectedReason = "";
    document.getElementById('otherReason').style.display = "none";

    reasons.forEach(r => {
      const div = document.createElement('div');
      div.className = 'chip';
      div.innerText = r;
      div.onclick = () => {
        document.querySelectorAll('#reasonContainer .chip').forEach(c => c.classList.remove('active'));
        div.classList.add('active');
        selectedReason = r;
        document.getElementById('otherReason').style.display = (r === "その他") ? "block" : "none";
      };
      container.appendChild(div);
    });
  }

  document.getElementById('btnAbsent').onclick = () => { currentStatus = "欠席"; updateStatusUI(); };
  document.getElementById('btnLate').onclick = () => { currentStatus = "遅刻"; updateStatusUI(); };
  document.getElementById('btnLeave').onclick = () => { currentStatus = "早退"; updateStatusUI(); };

  function updateStatusUI() {
    document.getElementById('btnAbsent').className = currentStatus === "欠席" ? "btn-status active" : "btn-status";
    document.getElementById('btnLate').className = currentStatus === "遅刻" ? "btn-status active" : "btn-status";
    document.getElementById('btnLeave').className = currentStatus === "早退" ? "btn-status active" : "btn-status";

    document.getElementById('arrivalSection').style.display = currentStatus === "遅刻" ? "block" : "none";
    document.getElementById('leaveSection').style.display = currentStatus === "早退" ? "block" : "none";

    updateReasons();
  }

  document.getElementById('btnUndecided').onclick = (e) => {
    e.target.classList.toggle('active');
    const inputMin = document.getElementById('arriveMin');
    if (e.target.classList.contains('active')) {
      inputMin.value = "";
      inputMin.disabled = true;
    } else {
      inputMin.disabled = false;
    }
  };

  document.getElementById('submitBtn').onclick = async () => {
    if (!selectedEvent) return alert("カレンダーから予定を選択してください");
    if (!selectedReason) return alert("理由を選択してください");
    
    const otherText = document.getElementById('otherReason').value;
    if (selectedReason === "その他" && !otherText) return alert("その他の具体的な理由を入力してください");

    let arrivalInfo = "";
    let leaveInfo = "";

    if (currentStatus === "遅刻") {
      const isUndecided = document.getElementById('btnUndecided').classList.contains('active');
      const min = document.getElementById('arriveMin').value;
      if (!isUndecided && !min) return alert("到着予定時刻（分後）を入力するか、未定を選択してください");
      arrivalInfo = isUndecided ? "未定" : `${min}分後`;
    } else if (currentStatus === "早退") {
      const lTime = document.getElementById('leaveTime').value;
      if (!lTime) return alert("早退予定時刻を入力してください");
      leaveInfo = `${lTime}頃`;
    }

    try {
      await addDoc(collection(db, "reports"), {
        name: userData.name,
        email: currentUser.email,
        eventTitle: selectedEvent.title,
        eventDate: selectedEvent.date,
        timeText: selectedEvent.timeText || "",
        year: selectedEvent.year || "令和6年度",
        status: currentStatus,
        reason: selectedReason,
        otherReason: otherText,
        arrival: arrivalInfo,
        leaveTime: leaveInfo,
        timestamp: serverTimestamp()
      });
      alert("送信が完了しました。");
      location.reload();
    } catch (e) {
      alert("送信エラー: " + e.message);
    }
  };
</script>
</body>
</html>
