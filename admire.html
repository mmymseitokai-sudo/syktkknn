<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生徒会 管理システム</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #ffffff; margin: 0; padding: 15px; display: flex; justify-content: center; color: #111111; }
        .admin-container { background: #ffffff; width: 100%; max-width: 800px; border: 1px solid #111111; border-radius: 8px; padding: 25px; box-sizing: border-box; }
        
        .screen { display: none; }
        h1, h2 { text-align: center; border-bottom: 2px solid #111111; padding-bottom: 10px; margin-top: 0; font-size: 18px; }
        
        .btn-back { background: white; border: 1px solid #111111; border-radius: 4px; padding: 6px 12px; font-weight: bold; cursor: pointer; margin-bottom: 15px; display: inline-block; font-size: 12px; }
        .btn-back:hover { background: #f1f1f1; }
        
        /* メニュー */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .menu-card { border: 1px solid #111111; border-radius: 6px; padding: 30px 15px; text-align: center; cursor: pointer; background: #ffffff; user-select: none; }
        .menu-card:hover { background: #f1f1f1; }
        .menu-title { font-size: 16px; font-weight: bold; margin-bottom: 4px; }
        .menu-sub { font-size: 12px; color: #555555; }

        /* カレンダー共通 */
        .cal-box { background: #fff; border: 1px solid #111111; border-radius: 6px; padding: 10px; max-width: 400px; margin: 0 auto 15px auto; }
        .cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: bold; }
        .cal-nav button { background: white; border: 1px solid #111111; border-radius: 4px; padding: 2px 8px; cursor: pointer; font-size: 12px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 2px; }
        .cal-head { font-size: 12px; font-weight: bold; border-bottom: 1px solid #111111; padding-bottom: 3px; }
        .cal-day { min-height: 36px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; cursor: pointer; border-radius: 4px; }
        .cal-day.selectable:hover { text-decoration: underline; }
        
        /* 色分け丸 */
        .circle-mark { width: 28px; height: 28px; line-height: 28px; border-radius: 50%; font-weight: bold; text-align: center; color: #222222; box-sizing: border-box; }
        .circle-meeting { background-color: #ffb8c6; }
        .circle-prep { background-color: #bbf2c8; }
        .circle-other { background-color: #fff099; }

        /* ★削除用に複数選択された丸 */
        .circle-mark.is-selected { outline: 2px solid #111111; outline-offset: 1px; box-shadow: 0 0 0 2px #ffffff; }

        /* 確認画面で選択された日 */
        .cal-day.view-selected { outline: 2px solid #111111; outline-offset: -2px; }

        /* 凡例 */
        .cal-legend { display: flex; justify-content: center; gap: 12px; font-size: 11px; margin-top: 10px; padding-top: 8px; border-top: 1px solid #dee2e6; color: #495057; }
        .legend-item { display: flex; align-items: center; gap: 4px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .dot.meeting { background-color: #ffb8c6; }
        .dot.prep { background-color: #bbf2c8; }
        .dot.other { background-color: #fff099; }

        /* カレンダー直下の予定一括削除ボタン */
        .delete-bar { max-width: 400px; margin: 0 auto 20px auto; text-align: center; }
        .btn-delete-events { width: 100%; background: #dc3545; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; font-size: 13px; cursor: pointer; }
        .btn-delete-events:disabled { background: #e9ecef; color: #adb5bd; cursor: not-allowed; border: 1px solid #ced4da; }

        /* フォーム */
        .form-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
        input[type="text"], input[type="date"], input[type="time"], select { padding: 8px; border: 1px solid #111111; border-radius: 4px; font-size: 13px; }
        .time-options { display: flex; gap: 20px; margin: 5px 0 10px 0; font-size: 13px; font-weight: bold; }
        .add-btn { width: 100%; background: #111111; color: white; border: none; padding: 12px; border-radius: 4px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 10px; }

        /* 確認画面ボード（純粋な閲覧用） */
        .board-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        @media (max-width: 600px) { .board-container { grid-template-columns: 1fr; } }
        
        .board-card { border: 1px solid #111111; border-radius: 6px; padding: 15px; background: #ffffff; min-height: 200px; }
        .board-header { font-size: 14px; font-weight: bold; border-bottom: 1px solid #111111; padding-bottom: 6px; margin-bottom: 12px; text-align: center; }
        
        .report-item { padding: 8px 0; border-bottom: 1px solid #f1f3f5; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .report-item:last-child { border-bottom: none; }
        .badge-text { font-size: 11px; font-weight: bold; border: 1px solid #111111; padding: 1px 4px; border-radius: 2px; margin-right: 6px; }

        .login-btn { padding: 12px 30px; background: #111111; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; display: block; margin: 20px auto; font-size: 14px; }
    </style>
</head>
<body>

<div class="admin-container">

    <!-- 画面0: ログイン画面 -->
    <div id="login-screen" class="screen" style="display: block; text-align: center;">
        <h1>生徒会 管理システム</h1>
        <p style="font-size: 13px;">Googleアカウントでログインしてください。</p>
        <button class="login-btn" id="loginBtn">管理者ログイン</button>
    </div>

    <!-- 画面1: ホーム画面 -->
    <div id="admin-home" class="screen">
        <h1>管理者メニュー</h1>
        <div class="menu-grid">
            <div class="menu-card" onclick="window.showScreen('admin-add')">
                <div class="menu-title">予定の追加・削除</div>
                <div class="menu-sub">カレンダーから日時の作成と丸タップ削除</div>
            </div>
            <div class="menu-card" onclick="window.showScreen('admin-view')">
                <div class="menu-title">出欠の確認</div>
                <div class="menu-sub">欠席・遅刻・早退の一覧確認</div>
            </div>
        </div>
    </div>

    <!-- 画面2: 予定追加・削除画面 -->
    <div id="admin-add" class="screen">
        <button class="btn-back" onclick="window.showScreen('admin-home')">← メニューへ戻る</button>
        <h2>活動予定の追加・削除</h2>
        
        <div class="cal-box">
            <div style="font-size: 11px; text-align:center; margin-bottom:5px; color:#555;">
                丸をタップして削除選択 / 空白をタップして新規登録
            </div>
            <div class="cal-nav">
                <button onclick="window.changeMonth(-1, 'add')">前月</button>
                <span id="addCalMonthDisplay">0月</span>
                <button onclick="window.changeMonth(1, 'add')">翌月</button>
            </div>
            <div class="cal-grid">
                <div class="cal-head">日</div><div class="cal-head">月</div><div class="cal-head">火</div><div class="cal-head">水</div><div class="cal-head">木</div><div class="cal-head">金</div><div class="cal-head">土</div>
            </div>
            <div class="cal-grid" id="addCalDays" style="margin-top: 4px;"></div>
            
            <div class="cal-legend">
                <div class="legend-item"><span class="dot meeting"></span> ミーティング</div>
                <div class="legend-item"><span class="dot prep"></span> 文化祭準備</div>
                <div class="legend-item"><span class="dot other"></span> その他</div>
            </div>
        </div>

        <!-- ★カレンダー直下の予定一括削除ボタン -->
        <div class="delete-bar">
            <button class="btn-delete-events" id="deleteEventsBtn" disabled>
                削除する予定を選択してください
            </button>
        </div>

        <div style="font-size: 13px; font-weight: bold; margin-bottom: 8px; border-top: 1px solid #111; padding-top: 15px;">新規予定の登録</div>
        <div class="form-row">
            <select id="eventYear" style="flex: 1;">
                <option value="令和6年度">令和6年度</option>
                <option value="令和7年度">令和7年度</option>
                <option value="令和8年度">令和8年度</option>
            </select>
            <select id="eventCategory" style="flex: 1;">
                <option value="ミーティング">ミーティング</option>
                <option value="文化祭準備">文化祭準備</option>
                <option value="その他">その他</option>
            </select>
        </div>

        <div class="form-row">
            <input type="date" id="selectedDateInput" required style="flex: 1;">
            <input type="text" id="eventTitle" placeholder="予定タイトル（例：全体ミーティング）" style="flex: 2;">
        </div>

        <div style="font-weight: bold; font-size: 12px; margin-top: 5px;">時間設定：</div>
        <div class="time-options">
            <label><input type="radio" name="timeType" value="custom" checked> 時間指定</label>
            <label><input type="radio" name="timeType" value="lunch"> 昼休み</label>
            <label><input type="radio" name="timeType" value="afterschool"> 放課後</label>
        </div>

        <div id="customTimeBox" class="form-row">
            <input type="time" id="startTime" value="13:00">
            <span style="line-height: 34px;">〜</span>
            <input type="time" id="endTime" value="14:00">
        </div>

        <button class="add-btn" id="addEventBtn">この予定をカレンダーに登録</button>
    </div>

    <!-- 画面3: 出欠確認画面（削除機能なし・純粋な閲覧専用） -->
    <div id="admin-view" class="screen">
        <button class="btn-back" onclick="window.showScreen('admin-home')">← メニューへ戻る</button>
        <h2>出欠確認ダッシュボード</h2>

        <div class="cal-box">
            <div class="cal-nav">
                <button onclick="window.changeMonth(-1, 'view')">前月</button>
                <span id="viewCalMonthDisplay">0月</span>
                <button onclick="window.changeMonth(1, 'view')">翌月</button>
            </div>
            <div class="cal-grid">
                <div class="cal-head">日</div><div class="cal-head">月</div><div class="cal-head">火</div><div class="cal-head">水</div><div class="cal-head">木</div><div class="cal-head">金</div><div class="cal-head">土</div>
            </div>
            <div class="cal-grid" id="viewCalDays" style="margin-top: 4px;"></div>
            
            <div class="cal-legend">
                <div class="legend-item"><span class="dot meeting"></span> ミーティング</div>
                <div class="legend-item"><span class="dot prep"></span> 文化祭準備</div>
                <div class="legend-item"><span class="dot other"></span> その他</div>
            </div>
        </div>

        <div id="viewSelectedInfo" style="text-align: center; font-weight: bold; margin-bottom: 12px; font-size: 13px;">
            カレンダーの日付を選択してください
        </div>

        <div class="board-container">
            <div class="board-card">
                <div class="board-header">欠席者</div>
                <div id="absentList">
                    <p style="color: #888; font-size: 12px; text-align: center;">予定を選択してください</p>
                </div>
            </div>

            <div class="board-card">
                <div class="board-header">遅刻・早退</div>
                <div id="lateLeaveList">
                    <p style="color: #888; font-size: 12px; text-align: center;">予定を選択してください</p>
                </div>
            </div>
        </div>
    </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDSFJupOUtPV1zNlPxcYaQOzZyVU34w7o0",
    authDomain: "kesseki-appointment.firebaseapp.com",
    projectId: "kesseki-appointment",
    storageBucket: "kesseki-appointment.firebasestorage.app",
    messagingSenderId: "1043634407845",
    appId: "1:1043634407845:web:4a0f7bd36079dd6858c04c",
    measurementId: "G-H6BWPXJTFQ"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let viewDate = new Date();
  let allEvents = [];
  let allReports = [];
  let selectedDateForView = "";
  let selectedEventIdsForDelete = new Set(); // 削除用に選択された予定ID

  window.showScreen = (screenId) => {
    document.querySelectorAll('.screen').forEach(el => el.style.display = 'none');
    const target = document.getElementById(screenId);
    if (target) target.style.display = 'block';
    
    if (screenId === 'admin-add') {
      selectedEventIdsForDelete.clear();
      updateDeleteButton();
      renderCalendar('add');
    }
    if (screenId === 'admin-view') {
      renderCalendar('view');
    }
  };

  document.getElementById('loginBtn').onclick = () => {
    signInWithPopup(auth, new GoogleAuthProvider()).catch(e => alert("ログインエラー: " + e.message));
  };

  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.showScreen('admin-home');
      listenData();
    } else {
      window.showScreen('login-screen');
    }
  });

  function listenData() {
    onSnapshot(query(collection(db, "events"), orderBy("date", "desc")), (snap) => {
      allEvents = [];
      snap.forEach(d => allEvents.push({ id: d.id, ...d.data() }));
      renderCalendar('add');
      renderCalendar('view');
    });

    onSnapshot(query(collection(db, "reports"), orderBy("timestamp", "desc")), (snap) => {
      allReports = [];
      snap.forEach(d => allReports.push({ id: d.id, ...d.data() }));
      if (selectedDateForView) updateBoard(selectedDateForView);
    });
  }

  document.querySelectorAll('input[name="timeType"]').forEach(radio => {
    radio.addEventListener('change', (e) => {
      document.getElementById('customTimeBox').style.display = (e.target.value === 'custom') ? 'flex' : 'none';
    });
  });

  window.changeMonth = (diff, mode) => {
    viewDate.setMonth(viewDate.getMonth() + diff);
    renderCalendar(mode);
  };

  // カレンダー描画
  function renderCalendar(mode) {
    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    const displayId = mode === 'add' ? 'addCalMonthDisplay' : 'viewCalMonthDisplay';
    const containerId = mode === 'add' ? 'addCalDays' : 'viewCalDays';
    
    const displayEl = document.getElementById(displayId);
    const container = document.getElementById(containerId);
    if (!displayEl || !container) return;

    displayEl.innerText = `${year}年 ${month + 1}月`;

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    container.innerHTML = "";

    for (let i = 0; i < firstDay; i++) {
      const div = document.createElement('div');
      div.className = "cal-day";
      container.appendChild(div);
    }

    for (let d = 1; d <= lastDate; d++) {
      const div = document.createElement('div');
      div.className = "cal-day selectable";
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const dayEvents = allEvents.filter(e => e.date === dateStr);

      if (dayEvents.length > 0) {
        const ev = dayEvents[0];
        let circleClass = 'circle-meeting';
        if (ev.category === '文化祭準備') circleClass = 'circle-prep';
        else if (ev.category === 'その他') circleClass = 'circle-other';

        const circle = document.createElement('div');
        circle.className = `circle-mark ${circleClass}`;
        circle.innerText = d;

        // ★追加・削除画面の場合：丸を直接タップして複数選択・解除
        if (mode === 'add') {
          if (selectedEventIdsForDelete.has(ev.id)) {
            circle.classList.add('is-selected');
          }
          div.onclick = () => {
            if (selectedEventIdsForDelete.has(ev.id)) {
              selectedEventIdsForDelete.delete(ev.id);
            } else {
              selectedEventIdsForDelete.add(ev.id);
            }
            updateDeleteButton();
            renderCalendar('add');
          };
        } else {
          // 確認画面の場合：日付選択して出欠表示
          if (selectedDateForView === dateStr) div.classList.add('view-selected');
          div.onclick = () => {
            container.querySelectorAll('.cal-day').forEach(el => el.classList.remove('view-selected'));
            div.classList.add('view-selected');
            selectedDateForView = dateStr;
            updateBoard(dateStr);
          };
        }

        div.appendChild(circle);
      } else {
        div.innerText = d;
        // 予定がない日をタップした時：新規登録フォームに日付をセット
        if (mode === 'add') {
          div.onclick = () => {
            document.getElementById('selectedDateInput').value = dateStr;
          };
        }
      }

      container.appendChild(div);
    }
  }

  // 予定削除ボタンの表示更新
  function updateDeleteButton() {
    const btn = document.getElementById('deleteEventsBtn');
    const count = selectedEventIdsForDelete.size;
    if (count > 0) {
      btn.disabled = false;
      btn.innerText = `選択した予定を削除する（${count}件）`;
    } else {
      btn.disabled = true;
      btn.innerText = "削除する予定（丸）をタップして選択";
    }
  }

  // 予定の一括削除実行
  document.getElementById('deleteEventsBtn').onclick = async () => {
    const count = selectedEventIdsForDelete.size;
    if (count === 0) return;
    if (!confirm(`選択した ${count} 件の予定をカレンダーから削除しますか？`)) return;

    try {
      const promises = Array.from(selectedEventIdsForDelete).map(id => deleteDoc(doc(db, "events", id)));
      await Promise.all(promises);
      selectedEventIdsForDelete.clear();
      updateDeleteButton();
      alert("選択した予定を削除しました。");
    } catch (e) {
      alert("削除エラー: " + e.message);
    }
  };

  // 出欠確認ボードの表示（純粋な閲覧専用）
  function updateBoard(dateStr) {
    const dayEvents = allEvents.filter(e => e.date === dateStr);
    const dayReports = allReports.filter(r => r.eventDate === dateStr);

    const infoEl = document.getElementById('viewSelectedInfo');
    if (dayEvents.length > 0) {
      const ev = dayEvents[0];
      infoEl.innerText = `${dateStr} ${ev.title} (${ev.timeText || '時間指定なし'})`;
    } else {
      infoEl.innerText = `${dateStr} （登録された予定はありません）`;
    }

    const absentList = document.getElementById('absentList');
    const lateLeaveList = document.getElementById('lateLeaveList');
    absentList.innerHTML = "";
    lateLeaveList.innerHTML = "";

    const absents = dayReports.filter(r => r.status === '欠席');
    const lateLeaves = dayReports.filter(r => r.status === '遅刻' || r.status === '早退');

    // 欠席者一覧
    if (absents.length === 0) {
      absentList.innerHTML = '<p style="color: #888; font-size: 12px; text-align: center;">欠席者はいません</p>';
    } else {
      absents.forEach(r => {
        const item = document.createElement('div');
        item.className = "report-item";
        item.innerHTML = `
          <div><strong>${r.name}</strong></div>
          <div style="font-size: 12px; color: #555;">理由: ${r.reason === 'その他' ? r.otherReason : r.reason}</div>
        `;
        absentList.appendChild(item);
      });
    }

    // 遅刻・早退者一覧
    if (lateLeaves.length === 0) {
      lateLeaveList.innerHTML = '<p style="color: #888; font-size: 12px; text-align: center;">遅刻・早退者はいません</p>';
    } else {
      lateLeaves.forEach(r => {
        const item = document.createElement('div');
        item.className = "report-item";
        
        let badgeLabel = r.status === '早退' ? '早退' : '遅刻';
        let timeStr = r.status === '早退' ? `〜 ${r.leaveTime || '未定'}` : `〜 ${r.arrival || '未定'}`;

        item.innerHTML = `
          <div>
            <span class="badge-text">${badgeLabel}</span>
            <strong>${r.name}</strong>
          </div>
          <div style="font-size: 12px; color: #555;">${timeStr} (${r.reason === 'その他' ? r.otherReason : r.reason})</div>
        `;
        lateLeaveList.appendChild(item);
      });
    }
  }

  // 予定登録
  document.getElementById('addEventBtn').onclick = async () => {
    const year = document.getElementById('eventYear').value;
    const category = document.getElementById('eventCategory').value;
    const date = document.getElementById('selectedDateInput').value;
    const title = document.getElementById('eventTitle').value.trim();
    const timeType = document.querySelector('input[name="timeType"]:checked').value;

    if (!date || !title) return alert("日付とタイトルを入力してください");

    let timeText = "";
    if (timeType === "custom") {
      const s = document.getElementById('startTime').value;
      const e = document.getElementById('endTime').value;
      if (!s || !e) return alert("開始時間と終了時間を指定してください");
      timeText = `${s}〜${e}`;
    } else if (timeType === "lunch") {
      timeText = "昼休み";
    } else if (timeType === "afterschool") {
      timeText = "放課後";
    }

    try {
      await addDoc(collection(db, "events"), {
        year, category, date, title, timeType, timeText, createdAt: serverTimestamp()
      });
      alert(`【${date}】の予定を登録しました。`);
      document.getElementById('eventTitle').value = "";
      window.showScreen('admin-home');
    } catch (e) {
      alert("登録エラー: " + e.message);
    }
  };
</script>
</body>
</html>
