<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者画面 - 予定作成と連絡確認</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .admin-container { background: white; max-width: 900px; margin: 0 auto; border: 2px solid #333; border-radius: 10px; padding: 20px; box-shadow: 5px 5px 0px #333; }
        h1, h2 { text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .section { margin-bottom: 40px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        
        /* 予定作成フォーム */
        .form-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        input, select { padding: 10px; border: 1px solid #333; border-radius: 5px; flex: 1; min-width: 120px; }
        .add-btn { background: #2ed573; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; }

        /* テーブル */
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th, td { border: 1px solid #333; padding: 10px; text-align: left; }
        th { background-color: #333; color: white; }
        .status-absent { color: #ff4757; font-weight: bold; }
        .status-late { color: #ffa502; font-weight: bold; }
        
        #admin-content { display: none; }
        .login-btn { padding: 15px 30px; background: #4285F4; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; display: block; margin: 20px auto; }
    </style>
</head>
<body>

<div class="admin-container">
    <h1>生徒会・管理者画面</h1>

    <div id="login-screen">
        <button class="login-btn" id="loginBtn">管理者ログイン</button>
    </div>

    <div id="admin-content">
        <!-- 1. 予定の作成セクション -->
        <div class="section">
            <h2>① 活動予定の追加</h2>
            <div class="form-group">
                <select id="eventYear">
                    <option value="令和6年度">令和6年度</option>
                    <option value="令和7年度">令和7年度</option>
                </select>
                <input type="text" id="eventTitle" placeholder="例：全体ミーティング">
                <input type="datetime-local" id="eventDate">
                <select id="eventCategory">
                    <option value="ミーティング">ミーティング</option>
                    <option value="文化祭準備">文化祭準備</option>
                </select>
                <button class="add-btn" id="addEventBtn">予定を登録</button>
            </div>
        </div>

        <!-- 2. 連絡一覧セクション -->
        <div class="section">
            <h2>② 届いた欠席連絡</h2>
            <div class="form-group">
                <select id="filterYear">
                    <option value="令和6年度">令和6年度</option>
                    <option value="令和7年度">令和7年度</option>
                </select>
                <select id="filterEvent">
                    <option value="すべて">すべてのイベント</option>
                </select>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>名前</th>
                            <th>イベント名</th>
                            <th>状態</th>
                            <th>理由</th>
                            <th>詳細/到着予定</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDSFJupOUtPV1zNlPxcYaQOzZyVU34w7o0",
    authDomain: "kesseki-appointment.firebaseapp.com",
    projectId: "kesseki-appointment",
    storageBucket: "kesseki-appointment.firebasestorage.app",
    messagingSenderId: "1043634407845",
    appId: "1:1043634407845:web:4a0f7bd36079dd6858c04c",
    measurementId: "G-H6BWPXJTFQ"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-content').style.display = 'block';
      listenToEvents();
      listenToReports();
    }
  });

  document.getElementById('loginBtn').onclick = () => signInWithPopup(auth, new GoogleAuthProvider());

  // 予定を登録する処理
  document.getElementById('addEventBtn').onclick = async () => {
      const year = document.getElementById('eventYear').value;
      const title = document.getElementById('eventTitle').value;
      const date = document.getElementById('eventDate').value;
      const category = document.getElementById('eventCategory').value;

      if(!title || !date) return alert("タイトルと日時を入力してください");

      try {
          await addDoc(collection(db, "events"), {
              year, title, date, category, createdAt: serverTimestamp()
          });
          alert("予定を登録しました");
          document.getElementById('eventTitle').value = "";
      } catch (e) { alert("エラー: " + e.message); }
  };

  // 予定一覧を読み込んでセレクトボックスに反映
  function listenToEvents() {
      const q = query(collection(db, "events"), orderBy("date", "desc"));
      onSnapshot(q, (snapshot) => {
          const filter = document.getElementById('filterEvent');
          filter.innerHTML = '<option value="すべて">すべてのイベント</option>';
          snapshot.forEach(doc => {
              const data = doc.data();
              const option = document.createElement('option');
              option.value = data.title;
              option.innerText = `${data.year} ${data.date.replace('T',' ')} ${data.title}`;
              filter.appendChild(option);
          });
      });
  }

  // 報告をリアルタイムで読み込む
  function listenToReports() {
      const q = query(collection(db, "reports"), orderBy("timestamp", "desc"));
      onSnapshot(q, (snapshot) => {
          const tbody = document.getElementById('tableBody');
          const fYear = document.getElementById('filterYear').value;
          const fEvent = document.getElementById('filterEvent').value;
          tbody.innerHTML = "";

          snapshot.forEach(doc => {
              const data = doc.data();
              // 簡易フィルター
              if(fYear !== "すべて" && data.year && data.year !== fYear) return;
              if(fEvent !== "すべて" && data.eventTitle && data.eventTitle !== fEvent) return;

              const tr = document.createElement('tr');
              tr.innerHTML = `
                <td>${data.kanjiName}<br><small>${data.kanaName}</small></td>
                <td>${data.eventTitle || "旧データ"}</td>
                <td class="${data.status === '欠席' ? 'status-absent' : 'status-late'}">${data.status}</td>
                <td>${data.reason === 'その他' ? data.otherReason : data.reason}</td>
                <td>${data.arrival || "-"}</td>
              `;
              tbody.appendChild(tr);
          });
      });
  }
</script>
</body>
</html>
