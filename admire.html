<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生徒会 管理者ポータル</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .admin-container { background: white; width: 100%; max-width: 800px; border: 2px solid #333; border-radius: 15px; padding: 20px; box-shadow: 5px 5px 0px #333; box-sizing: border-box; }
        
        .screen { display: none; }
        h1, h2 { text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-top: 0; }
        
        /* 共通ボタン */
        .btn-back { background: none; border: 1px solid #333; border-radius: 6px; padding: 6px 12px; font-weight: bold; cursor: pointer; margin-bottom: 15px; display: inline-block; }
        .btn-back:hover { background: #eee; }
        
        /* ホーム画面メニュー */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
        .menu-card { border: 2px solid #333; border-radius: 12px; padding: 30px 15px; text-align: center; cursor: pointer; transition: 0.2s; box-shadow: 3px 3px 0px #333; background: #fafafa; }
        .menu-card:hover { transform: translateY(-3px); background: #fff; }
        .menu-icon { font-size: 36px; margin-bottom: 10px; }
        .menu-title { font-size: 18px; font-weight: bold; }

        /* カレンダー共通 */
        .cal-box { background: #fff; border: 2px solid #333; border-radius: 10px; padding: 10px; max-width: 420px; margin: 0 auto 15px auto; }
        .cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: bold; }
        .cal-nav button { background: none; border: 1px solid #333; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 4px; }
        .cal-head { font-size: 12px; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 3px; }
        .cal-day { min-height: 35px; display: flex; align-items: center; justify-content: center; font-size: 13px; border-radius: 4px; cursor: pointer; }
        .cal-day.selectable:hover { background-color: #f1f2f6; }
        .cal-day.selected { background-color: #ffeaa7 !important; border: 2px solid #333 !important; font-weight: bold; }
        
        /* パステルカラー丸マーク */
        .circle-mark { width: 26px; height: 26px; line-height: 26px; border-radius: 50%; font-weight: bold; text-align: center; color: #222222; }
        .circle-meeting { background-color: #ffb8c6; }
        .circle-prep { background-color: #bbf2c8; }
        .circle-other { background-color: #fff099; }

        /* 追加画面フォーム */
        .form-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
        input, select { padding: 10px; border: 1px solid #333; border-radius: 5px; font-size: 15px; }
        .time-options { display: flex; gap: 15px; margin: 5px 0 10px 0; font-weight: bold; }
        .add-btn { width: 100%; background: #2ed573; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }

        /* ★確認画面：2カラムレイアウト */
        .board-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        @media (max-width: 600px) { .board-container { grid-template-columns: 1fr; } }
        
        .board-card { border: 2px solid #333; border-radius: 10px; padding: 12px; background: #fff; min-height: 200px; }
        .board-header { font-size: 16px; font-weight: bold; border-bottom: 2px solid #333; padding-bottom: 6px; margin-bottom: 10px; text-align: center; }
        
        /* リストアイテム */
        .report-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 6px; border-bottom: 1px dashed #ddd; font-size: 14px; }
        .report-item:last-child { border-bottom: none; }
        
        /* [早] [遅] バッジ */
        .badge-icon { width: 24px; height: 24px; line-height: 24px; border-radius: 50%; font-size: 12px; font-weight: bold; text-align: center; color: white; display: inline-block; margin-right: 6px; flex-shrink: 0; }
        .badge-leave { background: #8854d0; } /* 早退（紫） */
        .badge-late { background: #ffa502; }  /* 遅刻（オレンジ） */

        .login-btn { padding: 15px 30px; background: #4285F4; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; display: block; margin: 30px auto; font-size: 16px; }
    </style>
</head>
<body>

<div class="admin-container">

    <!-- ログイン画面 -->
    <div id="login-screen" class="screen" style="display: block; text-align: center;">
        <h1>生徒会 管理者ポータル</h1>
        <p>Googleアカウントでログインしてください。</p>
        <button class="login-btn" id="loginBtn">管理者ログイン</button>
    </div>

    <!-- 画面1: ホーム画面 -->
    <div id="admin-home" class="screen">
        <h1>生徒会 管理者メニュー</h1>
        <div class="menu-grid">
            <div class="menu-card" id="toAddScreenBtn">
                <div class="menu-icon">📅</div>
                <div class="menu-title">予定の追加</div>
                <div style="font-size: 12px; color: #666; margin-top: 5px;">ミーティング等の日時作成</div>
            </div>
            <div class="menu-card" id="toViewScreenBtn">
                <div class="menu-icon">📋</div>
                <div class="menu-title">連絡の確認</div>
                <div style="font-size: 12px; color: #666; margin-top: 5px;">欠席・遅刻・早退の一覧</div>
            </div>
        </div>
    </div>

    <!-- 画面2: 予定追加画面 -->
    <div id="admin-add" class="screen">
        <button class="btn-back" onclick="showScreen('admin-home')">← ホームに戻る</button>
        <h2>活動予定の追加</h2>
        
        <!-- 追加用カレンダー -->
        <div class="cal-box">
            <div style="font-size: 12px; color:#666; text-align:center; margin-bottom:5px;">カレンダーの日付をタップして選択</div>
            <div class="cal-nav">
                <button onclick="changeMonth(-1, 'add')">＜</button>
                <span id="addCalMonthDisplay">0月</span>
                <button onclick="changeMonth(1, 'add')">＞</button>
            </div>
            <div class="cal-grid">
                <div class="cal-head" style="color:#ff4757;">日</div>
                <div class="cal-head">月</div><div class="cal-head">火</div><div class="cal-head">水</div><div class="cal-head">木</div><div class="cal-head">金</div>
                <div class="cal-head" style="color:#1e90ff;">土</div>
            </div>
            <div class="cal-grid" id="addCalDays" style="margin-top: 4px;"></div>
        </div>

        <div class="form-row">
            <select id="eventYear" style="flex: 1;">
                <option value="令和6年度">令和6年度</option>
                <option value="令和7年度">令和7年度</option>
            </select>
            <select id="eventCategory" style="flex: 1;">
                <option value="ミーティング">🌸 ミーティング（ピンク）</option>
                <option value="文化祭準備">🌿 文化祭準備（緑）</option>
                <option value="その他">🍋 その他（黄色）</option>
            </select>
        </div>

        <div class="form-row">
            <input type="date" id="selectedDateInput" required style="flex: 1;">
            <input type="text" id="eventTitle" placeholder="タイトル（例：第1回全体MTG）" style="flex: 2;">
        </div>

        <div style="font-weight: bold; font-size: 14px; margin-top: 5px;">時間設定：</div>
        <div class="time-options">
            <label><input type="radio" name="timeType" value="custom" checked> 時間指定</label>
            <label><input type="radio" name="timeType" value="lunch"> 昼休み</label>
            <label><input type="radio" name="timeType" value="afterschool"> 放課後</label>
        </div>

        <div id="customTimeBox" class="form-row">
            <input type="time" id="startTime" value="13:00">
            <span style="line-height: 40px;">〜</span>
            <input type="time" id="endTime" value="14:00">
        </div>

        <button class="add-btn" id="addEventBtn">予定をカレンダーに登録する</button>
    </div>

    <!-- 画面3: 確認画面（スケッチの再現） -->
    <div id="admin-view" class="screen">
        <button class="btn-back" onclick="showScreen('admin-home')">← ホームに戻る</button>
        <h2>出欠確認ダッシュボード</h2>

        <!-- 確認用カレンダー -->
        <div class="cal-box">
            <div class="cal-nav">
                <button onclick="changeMonth(-1, 'view')">＜</button>
                <span id="viewCalMonthDisplay">0月</span>
                <button onclick="changeMonth(1, 'view')">＞</button>
            </div>
            <div class="cal-grid">
                <div class="cal-head" style="color:#ff4757;">日</div>
                <div class="cal-head">月</div><div class="cal-head">火</div><div class="cal-head">水</div><div class="cal-head">木</div><div class="cal-head">金</div>
                <div class="cal-head" style="color:#1e90ff;">土</div>
            </div>
            <div class="cal-grid" id="viewCalDays" style="margin-top: 4px;"></div>
        </div>

        <div id="viewSelectedInfo" style="text-align: center; font-weight: bold; margin-bottom: 10px; color: #333;">
            日付をタップして確認してください
        </div>

        <!-- 左右2カラムボード -->
        <div class="board-container">
            <!-- 左：欠席者 -->
            <div class="board-card">
                <div class="board-header" style="color: #ff4757;">欠席者</div>
                <div id="absentList">
                    <p style="color: #888; font-size: 13px; text-align: center;">予定を選択してください</p>
                </div>
            </div>

            <!-- 右：遅刻・早退 -->
            <div class="board-card">
                <div class="board-header" style="color: #ffa502;">遅刻・早退</div>
                <div id="lateLeaveList">
                    <p style="color: #888; font-size: 13px; text-align: center;">予定を選択してください</p>
                </div>
            </div>
        </div>
    </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDSFJupOUtPV1zNlPxcYaQOzZyVU34w7o0",
    authDomain: "kesseki-appointment.firebaseapp.com",
    projectId: "kesseki-appointment",
    storageBucket: "kesseki-appointment.firebasestorage.app",
    messagingSenderId: "1043634407845",
    appId: "1:1043634407845:web:4a0f7bd36079dd6858c04c",
    measurementId: "G-H6BWPXJTFQ"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let viewDate = new Date();
  let allEvents = [];
  let allReports = [];
  let selectedDateForView = "";

  // 画面切り替え
  window.showScreen = (screenId) => {
    document.querySelectorAll('.screen').forEach(el => el.style.display = 'none');
    document.getElementById(screenId).style.display = 'block';
    if (screenId === 'admin-add') renderCalendar('add');
    if (screenId === 'admin-view') renderCalendar('view');
  };

  document.getElementById('toAddScreenBtn').onclick = () => showScreen('admin-add');
  document.getElementById('toViewScreenBtn').onclick = () => showScreen('admin-view');

  // ログイン
  document.getElementById('loginBtn').onclick = () => signInWithPopup(auth, new GoogleAuthProvider());

  onAuthStateChanged(auth, (user) => {
    if (user) {
      showScreen('admin-home');
      listenData();
    } else {
      showScreen('login-screen');
    }
  });

  // データ受信
  function listenData() {
    onSnapshot(query(collection(db, "events"), orderBy("date", "desc")), (snap) => {
      allEvents = [];
      snap.forEach(d => allEvents.push({ id: d.id, ...d.data() }));
      renderCalendar('add');
      renderCalendar('view');
    });

    onSnapshot(query(collection(db, "reports"), orderBy("timestamp", "desc")), (snap) => {
      allReports = [];
      snap.forEach(d => allReports.push(d.data()));
      if (selectedDateForView) updateBoard(selectedDateForView);
    });
  }

  // 時間ラジオボタンの切り替え
  document.querySelectorAll('input[name="timeType"]').forEach(radio => {
    radio.addEventListener('change', (e) => {
      document.getElementById('customTimeBox').style.display = (e.target.value === 'custom') ? 'flex' : 'none';
    });
  });

  // 月変更
  window.changeMonth = (diff, mode) => {
    viewDate.setMonth(viewDate.getMonth() + diff);
    renderCalendar(mode);
  };

  // カレンダー描画（共通）
  function renderCalendar(mode) {
    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    const displayId = mode === 'add' ? 'addCalMonthDisplay' : 'viewCalMonthDisplay';
    const containerId = mode === 'add' ? 'addCalDays' : 'viewCalDays';
    
    document.getElementById(displayId).innerText = `${year}年 ${month + 1}月`;

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const container = document.getElementById(containerId);
    container.innerHTML = "";

    for (let i = 0; i < firstDay; i++) {
      const div = document.createElement('div');
      div.className = "cal-day";
      container.appendChild(div);
    }

    for (let d = 1; d <= lastDate; d++) {
      const div = document.createElement('div');
      div.className = "cal-day selectable";
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const dayEvents = allEvents.filter(e => e.date === dateStr);

      if (dayEvents.length > 0) {
        const ev = dayEvents[0];
        let circleClass = 'circle-meeting';
        if (ev.category === '文化祭準備') circleClass = 'circle-prep';
        else if (ev.category === 'その他') circleClass = 'circle-other';

        const circle = document.createElement('div');
        circle.className = `circle-mark ${circleClass}`;
        circle.innerText = d;
        div.appendChild(circle);
      } else {
        div.innerText = d;
      }

      if (mode === 'add') {
        div.onclick = () => {
          container.querySelectorAll('.cal-day').forEach(el => el.classList.remove('selected'));
          div.classList.add('selected');
          document.getElementById('selectedDateInput').value = dateStr;
        };
      } else {
        // 確認画面でのクリック
        if (selectedDateForView === dateStr) div.classList.add('selected');
        div.onclick = () => {
          container.querySelectorAll('.cal-day').forEach(el => el.classList.remove('selected'));
          div.classList.add('selected');
          selectedDateForView = dateStr;
          updateBoard(dateStr);
        };
      }

      container.appendChild(div);
    }
  }

  // ★ボード（欠席 / 遅刻・早退）の更新
  function updateBoard(dateStr) {
    const dayEvents = allEvents.filter(e => e.date === dateStr);
    const dayReports = allReports.filter(r => r.eventDate === dateStr);

    const infoEl = document.getElementById('viewSelectedInfo');
    if (dayEvents.length > 0) {
      const ev = dayEvents[0];
      infoEl.innerText = `【${dateStr}】 ${ev.title} (${ev.timeText || '時間指定なし'})`;
    } else {
      infoEl.innerText = `【${dateStr}】 （登録された予定はありません）`;
    }

    const absentList = document.getElementById('absentList');
    const lateLeaveList = document.getElementById('lateLeaveList');
    absentList.innerHTML = "";
    lateLeaveList.innerHTML = "";

    const absents = dayReports.filter(r => r.status === '欠席');
    const lateLeaves = dayReports.filter(r => r.status === '遅刻' || r.status === '早退');

    // 欠席者の描画
    if (absents.length === 0) {
      absentList.innerHTML = '<p style="color: #999; font-size: 13px; text-align: center;">欠席者はいません</p>';
    } else {
      absents.forEach(r => {
        const item = document.createElement('div');
        item.className = "report-item";
        item.innerHTML = `
          <div><strong>${r.name}</strong></div>
          <div style="font-size: 12px; color: #666;">${r.reason === 'その他' ? r.otherReason : r.reason}</div>
        `;
        absentList.appendChild(item);
      });
    }

    // 遅刻・早退者の描画
    if (lateLeaves.length === 0) {
      lateLeaveList.innerHTML = '<p style="color: #999; font-size: 13px; text-align: center;">遅刻・早退者はいません</p>';
    } else {
      lateLeaves.forEach(r => {
        const item = document.createElement('div');
        item.className = "report-item";
        
        let badgeHtml = "";
        let timeStr = "";
        
        if (r.status === '早退') {
          badgeHtml = `<span class="badge-icon badge-leave">早</span>`;
          timeStr = `〜 ${r.leaveTime || '時間未定'}`;
        } else {
          badgeHtml = `<span class="badge-icon badge-late">遅</span>`;
          timeStr = `〜 ${r.arrival || '時間未定'}`;
        }

        item.innerHTML = `
          <div style="display: flex; align-items: center;">
            ${badgeHtml}
            <strong>${r.name}</strong>
          </div>
          <div style="font-size: 13px; font-weight: bold; color: #333;">${timeStr}</div>
        `;
        lateLeaveList.appendChild(item);
      });
    }
  }

  // 予定登録
  document.getElementById('addEventBtn').onclick = async () => {
    const year = document.getElementById('eventYear').value;
    const category = document.getElementById('eventCategory').value;
    const date = document.getElementById('selectedDateInput').value;
    const title = document.getElementById('eventTitle').value.trim();
    const timeType = document.querySelector('input[name="timeType"]:checked').value;

    if (!date || !title) return alert("日付とタイトルを入力してください");

    let timeText = "";
    if (timeType === "custom") {
      const s = document.getElementById('startTime').value;
      const e = document.getElementById('endTime').value;
      if (!s || !e) return alert("開始時間と終了時間を指定してください");
      timeText = `${s}〜${e}`;
    } else if (timeType === "lunch") {
      timeText = "昼休み";
    } else if (timeType === "afterschool") {
      timeText = "放課後";
    }

    try {
      await addDoc(collection(db, "events"), {
        year, category, date, title, timeType, timeText, createdAt: serverTimestamp()
      });
      alert(`【${date}】の予定を登録しました！`);
      document.getElementById('eventTitle').value = "";
      showScreen('admin-home'); // 登録後はホームへ戻る
    } catch (e) {
      alert("登録エラー: " + e.message);
    }
  };
</script>
</body>
</html>
